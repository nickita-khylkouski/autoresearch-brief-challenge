[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-brief-challenge"
version = "0.1.0"
description = "Public starter repo for a local-first scaffold-optimization benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Nickita Khylkouski" }
]

[tool.setuptools]
packages = ["challenge"]
